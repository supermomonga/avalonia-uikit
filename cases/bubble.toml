# GPUI Kit Bubble -> uikit:Bubble in a 360px column; a bubble is at most 80%
# of it. Reactions hang 20px over the bubble's edge.
component = "bubble"
viewport = [392, 96]
anchor = [16, 16]

[[group]]
name = "variant"
matrix = { variant = ["filled", "secondary", "muted", "tinted", "outline", "ghost", "destructive"] }

[[group]]
name = "align"
params = { variant = "secondary" }
matrix = { align = ["start", "end"] }

[[group]]
name = "wrap"
params = { variant = "secondary", text = "This message is long enough to wrap onto a second line inside the bubble." }
viewport = [392, 112]

[[group]]
name = "reaction"
params = { variant = "secondary", reaction = "+2" }
matrix = { reaction_side = ["top", "bottom"], reaction_align = ["start", "end"] }
anchor = [16, 32]
viewport = [392, 112]
