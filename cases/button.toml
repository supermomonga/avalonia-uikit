# GPUI Kit Button -> Avalonia Button.
component = "button"
viewport = [128, 48]
anchor = [16, 8]

[[group]]
name = "label"
params = { label = "Button" }
matrix = { variant = ["default", "primary", "secondary", "danger", "warning", "success", "info", "ghost", "link", "text"], size = ["xsmall", "small", "medium", "large"] }
states = ["normal", "hover", "pressed", "focus", "disabled"]

[[group]]
name = "outline"
params = { label = "Button", outline = true }
matrix = { variant = ["default", "primary", "secondary", "danger", "warning", "success", "info", "ghost"], size = ["small", "medium"] }
states = ["normal", "hover", "pressed", "focus", "disabled"]

[[group]]
name = "selected"
params = { label = "Button", selected = true }
matrix = { variant = ["default", "primary", "secondary", "danger", "warning", "success", "info", "ghost", "link", "text"], outline = [false, true] }
states = ["normal", "hover"]

[[group]]
name = "compact"
params = { label = "OK", compact = true }
matrix = { size = ["xsmall", "small", "medium", "large"] }
states = ["normal"]

[[group]]
name = "rounded"
params = { label = "Button" }
matrix = { rounded = ["none", "small", "large"], variant = ["default", "primary"] }
states = ["normal", "focus"]

[[group]]
name = "icon"
params = { icon = "copy" }
matrix = { variant = ["default", "primary", "ghost"], size = ["xsmall", "small", "medium", "large"] }
states = ["normal", "hover"]

# Aurora Light paints the token backgrounds as gradients (ADR 26).
[[group]]
name = "aurora"
params = { label = "Button" }
matrix = { variant = ["default", "primary", "secondary", "danger", "warning", "success", "info", "ghost"], outline = [false, true] }
states = ["normal", "hover", "pressed", "disabled"]
themes = ["aurora-light"]
