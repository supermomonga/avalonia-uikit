# GPUI Kit Input -> TextBox (MaskedTextBox shares the theme).
component = "input"
viewport = [240, 68]
anchor = [16, 12]

[[group]]
name = "value"
params = { value = "Hello world", width = 200 }
matrix = { size = ["xsmall", "small", "medium", "large"] }
states = ["normal", "focus", "disabled"]

# GPUI has no hover look.
[[group]]
name = "hover"
params = { value = "Hello world", width = 200 }
states = ["hover"]

[[group]]
name = "placeholder"
params = { placeholder = "Enter your name...", width = 200 }
matrix = { size = ["small", "medium"] }
states = ["normal", "focus", "disabled"]

[[group]]
name = "readonly"
params = { value = "Read only", readonly = true, width = 200 }
states = ["normal", "focus"]

[[group]]
name = "prefix"
params = { value = "Search", prefix = "search", width = 200 }
matrix = { size = ["xsmall", "small", "medium", "large"] }
states = ["normal", "focus", "disabled"]

# A ghost xsmall icon button as the suffix.
[[group]]
name = "suffix"
params = { value = "Hello", suffix = "info", width = 200 }
states = ["normal", "disabled"]

[[group]]
name = "masked"
params = { value = "password123", masked = true, width = 200 }
matrix = { mask_toggle = [false, true] }
states = ["normal", "focus"]

# The window active so GPUI paints the selection; 600ms after focus GPUI's
# caret is in its hidden phase.
[[group]]
name = "selection"
params = { value = "Hello world", select_all = true, width = 200 }
states = ["activate+focus+wait-600ms"]

# Input::cleanable(true): a clear button (text xsmall, the Close icon) after the
# text while it is editable and not empty: none when empty, read-only or
# disabled. The pointer on it (x 193-205) tints its icon; a click clears the
# text and focuses the input.
[[group]]
name = "cleanable"
params = { value = "Hello", cleanable = true, width = 200 }
matrix = { size = ["xsmall", "small", "medium", "large"] }
states = ["normal", "focus", "disabled"]

[[group]]
name = "cleanable-pointer"
params = { value = "Hello", cleanable = true, width = 200 }
states = ["at-199-28", "click-at-199-28"]

[[group]]
name = "cleanable-empty"
params = { placeholder = "Enter your name...", cleanable = true, width = 200 }

[[group]]
name = "cleanable-readonly"
params = { value = "Read only", readonly = true, cleanable = true, width = 200 }

# GPUI's suffix order: the mask toggle, the clear button, the app's suffix.
[[group]]
name = "cleanable-suffix"
params = { value = "password123", masked = true, mask_toggle = true, cleanable = true, suffix = "info", width = 200 }
states = ["normal", "focus"]
