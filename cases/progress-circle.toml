# GPUI Kit ProgressCircle -> ProgressBar with the GpuiProgressCircle theme.
component = "progress-circle"
viewport = [52, 36]
anchor = [16, 8]

# 8/12/16/20px rings; 0 = track only, 50 = half turn, 100 = full ring over the track.
[[group]]
name = "value"
matrix = { size = ["xsmall", "small", "medium", "large"], value = [0, 25, 50, 75, 100] }

# A styled 80px box (size_20): the stroke caps at 5px. Only if arbitrary sizes are supported.
[[group]]
name = "box"
params = { side = 80, value = 60 }
viewport = [112, 96]

[[motion]]
name = "value"
params = { size = "large", value = 25, value_to = 75 }
trigger = "click"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 133, 166, 200]
themes = ["light"]

# One loading cycle: the end leads in the first half, the start catches up in the second.
[[motion]]
name = "loading"
params = { size = "large", loading = true }
trigger = "wait-0ms"
samples_ms = [0, 100, 200, 300, 400, 500, 550, 600, 650, 700, 750, 800, 900, 950, 1000]
themes = ["light"]
