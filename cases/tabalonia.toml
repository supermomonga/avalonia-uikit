# GPUI Kit TabBar / Tab -> Tabalonia's TabsControl / DragTabItem (AvaloniaUIKit.Tabalonia).
# Tabalonia lays its tabs out at one width (TabItemWidth), so GPUI's three tabs
# (Account, Profile, Settings) are given the same width: 100px in a 360px bar.
# The width is also the bar's max_width, under which GPUI ellipsizes a label
# that does not fit, as TabItemWidth does.
component = "tabalonia"
viewport = [392, 60]
anchor = [16, 8]

[[group]]
name = "label"
params = { selected = 0, width = 360, tab_widths = [100, 100, 100], max_width = 100 }
matrix = { variant = ["tab", "outline", "pill", "segmented", "underline"], size = ["xsmall", "small", "medium", "large"] }

# Tab 1 selected, the pointer over tab 0 (14.4px from the bar's left edge).
[[group]]
name = "hover"
params = { selected = 1, width = 360, tab_widths = [100, 100, 100], max_width = 100, pointer_x = 0.04 }
matrix = { variant = ["tab", "outline", "pill", "segmented", "underline"] }
states = ["normal", "hover"]

# Tab 2 disabled (unselected), or tab 1 disabled while selected.
[[group]]
name = "disabled"
params = { selected = 1, width = 360, tab_widths = [100, 100, 100], max_width = 100 }
matrix = { variant = ["tab", "outline", "pill", "segmented", "underline"], disabled_index = [1, 2] }

[[group]]
name = "icon"
params = { selected = 0, width = 360, tab_widths = [48, 48, 48], icons = true }
matrix = { variant = ["tab", "outline", "pill", "segmented", "underline"], size = ["small", "medium"] }

# The tabs story's closable tab: px_2 and a ghost xsmall Close button as the suffix.
[[group]]
name = "closable"
params = { selected = 0, width = 360, tab_widths = [100, 100, 100], max_width = 100, closable = true }
matrix = { variant = ["tab", "outline", "pill", "segmented", "underline"], size = ["xsmall", "small", "medium", "large"] }

# The pointer on tab 0's close button (x = 16 + 100 - 1 - 8 - 10), and pressing it.
[[group]]
name = "close"
params = { selected = 1, width = 360, tab_widths = [100, 100, 100], max_width = 100, closable = true }
matrix = { variant = ["tab"] }
states = ["at-97-24", "pressed-at-97-24"]

# The bar's prefix and suffix: ghost xsmall buttons in an mx_1 row (the tabs story's).
[[group]]
name = "bar"
viewport = [472, 60]
params = { selected = 0, width = 440, tab_widths = [100, 100, 100], max_width = 100, bar_prefix = true, bar_suffix = true }
matrix = { variant = ["tab", "outline", "pill", "segmented", "underline"] }

# menu(true): the caret button at the bar's end (x = 16 + 360 - 10), closed and open.
# The open menu scrolls within the window's height: the window leaves it room.
[[group]]
name = "menu"
viewport = [392, 220]
params = { selected = 1, width = 360, tab_widths = [100, 100, 100], max_width = 100, menu = true }
matrix = { variant = ["tab", "underline"] }
states = ["normal", "click-at-366-24"]

# Aurora Light: the pill and the underline are the primary gradient (ADR 26).
[[group]]
name = "aurora"
params = { selected = 1, width = 360, tab_widths = [100, 100, 100], max_width = 100, pointer_x = 0.04 }
matrix = { variant = ["tab", "outline", "pill", "segmented", "underline"] }
states = ["normal", "hover"]
themes = ["aurora-light"]

# The indicator slides from tab 0 to tab 2. Pill: tab 2's centre x = 16 + 2 * 104 + 50.
[[motion]]
name = "pill"
params = { variant = "pill", selected = 0, width = 360, tab_widths = [100, 100, 100], max_width = 100 }
trigger = "click-at-274-24"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 133, 166, 200, 250, 300, 350, 400, 500]
themes = ["light"]

[[motion]]
name = "underline"
params = { variant = "underline", selected = 0, width = 360, tab_widths = [100, 100, 100], max_width = 100 }
trigger = "click-at-298-26"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 133, 166, 200, 250, 300, 350, 400, 500]
themes = ["light"]

[[motion]]
name = "segmented"
params = { variant = "segmented", selected = 0, width = 360, tab_widths = [100, 100, 100], max_width = 100 }
trigger = "click-at-274-24"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 133, 166, 200, 250, 300, 350, 400, 500]
themes = ["light"]
