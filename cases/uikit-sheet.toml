# GPUI Kit Sheet -> uikit:Sheet, shown with Sheet.Show on a click anywhere in
# the window: the sheet cases (the look of DrawerPage.sheet), then a size that
# is a part of the window, an overlay that does not close, a clear overlay
# that takes the press, and a body that scrolls. The builder sets GPUI's
# sheet.margin_top (title-bar offset) to 0. A right sheet spans x=210..560; its
# close button is x=524..548, y=9..33.
component = "uikit-sheet"
viewport = [560, 400]
anchor = [0, 0]

[[group]]
name = "open"
params = { width = 560, height = 400, title = "Settings" }
matrix = { placement = ["left", "right", "top", "bottom"] }
states = ["click+wait-200ms"]

[[group]]
name = "size"
params = { width = 560, height = 400, title = "Settings", size = 240 }
matrix = { placement = ["right", "bottom"] }
states = ["click+wait-200ms"]

[[group]]
name = "untitled"
params = { width = 560, height = 400, placement = "right" }
states = ["click+wait-200ms"]

[[group]]
name = "footer"
params = { width = 560, height = 400, placement = "right", title = "Settings", footer = true }
states = ["click+wait-200ms"]

# The close button hovered and pressed; closed by the button, the overlay and Escape.
[[group]]
name = "close"
params = { width = 560, height = 400, placement = "right", title = "Settings" }
states = [
  "click+wait-200ms+at-536-21",
  "click+wait-200ms+pressed-at-536-21",
  "click+wait-200ms+click-at-536-21+wait-50ms",
  "click+wait-200ms+click-at-60-200+wait-50ms",
  "click+wait-200ms+key-escape+wait-50ms",
]

[[group]]
name = "no-overlay"
params = { width = 560, height = 400, placement = "right", title = "Settings", no_overlay = true }
states = ["click+wait-200ms"]

# size(relative(0.5)): half the window's width or height.
[[group]]
name = "relative"
params = { width = 560, height = 400, title = "Settings", relative = 0.5 }
matrix = { placement = ["right", "bottom"] }
states = ["click+wait-200ms"]

# overlay_closable(false): a press on the overlay leaves the sheet open; so does
# one on the clear overlay of overlay(false).
[[group]]
name = "kept"
params = { width = 560, height = 400, placement = "right", title = "Settings" }
matrix = { mode = ["unclosable", "no-overlay"] }
states = ["click+wait-200ms+click-at-60-200+wait-50ms"]

# A hundred 40px rows, every other one muted: the body scrolls 40px under the
# wheel and its scrollbar (at its 48px minimum) shows.
[[group]]
name = "scroll"
params = { width = 560, height = 400, placement = "right", title = "Settings", rows = 100 }
states = ["click+wait-200ms", "click+wait-200ms+wheel-at-380-200+at-60-200+wait-400ms"]

[[motion]]
name = "slide-right"
params = { width = 560, height = 400, placement = "right", title = "Settings" }
trigger = "click"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 116, 133, 150, 166]
themes = ["light"]

[[motion]]
name = "slide-left"
params = { width = 560, height = 400, placement = "left", title = "Settings" }
trigger = "click"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 116, 133, 150, 166]
themes = ["light"]

[[motion]]
name = "slide-top"
params = { width = 560, height = 400, placement = "top", title = "Settings" }
trigger = "click"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 116, 133, 150, 166]
themes = ["light"]

[[motion]]
name = "slide-bottom"
params = { width = 560, height = 400, placement = "bottom", title = "Settings" }
trigger = "click"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 116, 133, 150, 166]
themes = ["light"]
