# GPUI's img() of a resource -> uikit:AsyncImage. The image cases
# (cases/image.toml) hold the loaded image to Image's look; then a load that
# fails (the fallback content at once) and one still pending (nothing, then
# the loading content once the load has run 200ms). The fallback and loading
# content is the app's: a muted box with the circle-x or the loader icon.
component = "uikit-image"
viewport = [128, 128]
anchor = [16, 16]

# Only the wide image, as in cases/image.toml (GPUI does not fit a tall one in the box).
[[group]]
name = "fit"
params = { width = 96, height = 96, image = "wide" }
matrix = { fit = ["fill", "contain", "cover", "scale-down"] }

[[group]]
name = "small"
params = { width = 96, height = 96, image = "small" }
matrix = { fit = ["contain", "scale-down", "none"] }

[[group]]
name = "rounded"
params = { width = 96, height = 96, radius = 8, image = "wide" }
matrix = { fit = ["contain", "cover"] }

[[group]]
name = "intrinsic"
params = { image = "small", width = 0, height = 0 }

[[group]]
name = "failed"
params = { width = 96, height = 96, source = "failed" }

[[group]]
name = "loading"
params = { width = 96, height = 96, source = "loading" }
states = ["normal", "wait-150ms", "wait-250ms"]
