# GPUI Kit NumberInput -> uikit:NumberInput (a NumericUpDown with NumericUpDown's
# look). The groups of number.toml hold it to the same look; the rest show
# GPUI's typing restriction and stepping (number_input.rs, gpui-base
# number_input.rs step_value).
component = "uikit-number"
viewport = [200, 60]
anchor = [16, 8]

[[group]]
name = "value"
params = { value = "42" }
matrix = { size = ["xsmall", "small", "medium", "large"] }
states = ["normal", "disabled"]

[[group]]
name = "buttons"
params = { value = "42" }
matrix = { size = ["small", "medium"] }
states = ["at-30-24", "at-30-24+pressed-at-30-24", "at-160-24"]

# The text stays a number: a letter is rejected, a leading point is kept.
[[group]]
name = "typing"
params = { value = "42" }
states = ["focus+key-5", "focus+key-a", "focus+key-backspace+key-backspace+key-.+key-5"]

# A step keeps the fraction digits of the value and the step: 0.1 ± 0.2.
[[group]]
name = "step"
params = { value = "0.1", step = 0.2 }
states = ["focus+key-up", "focus+key-down+key-down"]

# A step clamps to max, with the bound's digits; at the bound it does nothing.
[[group]]
name = "max"
params = { value = "99.5", max = 100 }
states = ["focus+key-up", "focus+key-up+key-up"]

# MaskPattern::Number { separator: ',', fraction: 2 } with step(100.).
[[group]]
name = "format"
params = { value = "1234.56", separator = ",", fraction = 2, step = 100, min = 0 }
states = ["normal", "focus+key-up"]
