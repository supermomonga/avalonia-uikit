# GPUI Kit Progress -> ProgressBar.
component = "progress"
viewport = [232, 26]
anchor = [16, 8]

[[group]]
name = "value"
params = { width = 200 }
matrix = { size = ["xsmall", "small", "medium", "large"], value = [0, 40, 100] }

[[motion]]
name = "value"
params = { width = 200, value = 20, value_to = 80 }
trigger = "click"
samples_ms = [0, 16, 33, 50, 66, 83, 100, 133, 166, 200]
themes = ["light"]

[[motion]]
name = "loading"
params = { width = 200, loading = true }
trigger = "wait-0ms"
samples_ms = [0, 100, 200, 300, 400, 500, 600, 700, 800, 900]
themes = ["light"]
