# GPUI Kit GroupBox -> GroupBox.
component = "groupbox"
viewport = [272, 140]
anchor = [16, 8]

[[group]]
name = "titled"
params = { title = "Account", content = "Content" }
matrix = { variant = ["normal", "fill", "outline"] }

[[group]]
name = "untitled"
params = { content = "Content" }
matrix = { variant = ["fill", "outline"] }

# GroupBox::footer (uikit:GroupBoxes.Footer): small muted text 8px under the surface.
[[group]]
name = "footer"
params = { title = "Account", content = "Content", footer = "Visible to everyone." }
matrix = { variant = ["normal", "fill", "outline"] }
viewport = [272, 180]
