name: Site

# Builds the documentation site (sites/) and deploys it to Cloudflare Workers
# at https://avalonia-uikit.omofla.sh when main changes what it is built
# from: the site, the themes and controls, the demos. Pull requests run the
# same build without deploying. See docs/site.md.
# src/Directory.Build.props is left out: it holds the packages' version and
# metadata, which the site does not show, and the Version Bump workflow's
# pull request changes nothing else. A run on that pull request, opened with
# GITHUB_TOKEN, would wait for approval (docs/release.md, ADR 39).
on:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - "src/**"
      - "!src/Directory.Build.props"
      - "samples/**"
      - "assets/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "sites/**"
      - "src/**"
      - "!src/Directory.Build.props"
      - "samples/**"
      - "assets/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The .NET side's outputs, the previews' manifest and the browser app, build
# in their own jobs side by side and reach the site job through the cache,
# keyed on the SDK and a hash of what they are built from: a change to the
# site alone builds no .NET (docs/site.md).
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache key
        id: key
        run: echo "key=previews-$RUNNER_OS-$(dotnet --version)-$HASH" >> "$GITHUB_OUTPUT"
        env:
          HASH: ${{ hashFiles('src/**', 'samples/AvaloniaUIKit.Demos/**', 'samples/AvaloniaUIKit.Previews/**', 'assets/**', 'Directory.Build.props', 'Directory.Packages.props', 'global.json', '.github/workflows/site.yml') }}

      - name: Look up the previews
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: sites/public/previews
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Cache NuGet packages
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-previews-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-previews-${{ runner.os }}-

      # The site needs the demos' sizes only: the PNGs are for the social image (docs/site.md).
      - name: Measure the demos
        if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet run --project samples/AvaloniaUIKit.Previews -c Release -- --out sites/public/previews --manifest-only

      - name: Save the previews
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sites/public/previews
          key: ${{ steps.key.outputs.key }}

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache key
        id: key
        run: echo "key=wasm-$RUNNER_OS-$(dotnet --version)-$HASH" >> "$GITHUB_OUTPUT"
        env:
          HASH: ${{ hashFiles('src/**', 'samples/AvaloniaUIKit.Demos/**', 'samples/AvaloniaUIKit.Browser/**', 'assets/**', 'Directory.Build.props', 'Directory.Packages.props', 'global.json', 'sites/scripts/publish-wasm.sh', '.github/workflows/site.yml') }}

      - name: Look up the browser app
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: sites/public/wasm
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Cache NuGet packages
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-wasm-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-wasm-${{ runner.os }}-

      - name: Install the WebAssembly workload
        if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Publish the browser app
        if: steps.cache.outputs.cache-hit != 'true'
        run: sites/scripts/publish-wasm.sh

      - name: Save the browser app
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sites/public/wasm
          key: ${{ steps.key.outputs.key }}

  site:
    needs: [previews, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ github.event_name != 'pull_request' && 'https://avalonia-uikit.omofla.sh' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: sites/package.json

      - name: Install the site's dependencies
        run: bun install --frozen-lockfile
        working-directory: sites

      - name: The demo registry is up to date
        run: bun sites/scripts/demo-registry.ts --check

      - name: The control catalog is up to date
        run: bun sites/scripts/control-catalog.ts --check

      - name: Restore the previews
        uses: actions/cache/restore@v4
        with:
          path: sites/public/previews
          key: ${{ needs.previews.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore the browser app
        uses: actions/cache/restore@v4
        with:
          path: sites/public/wasm
          key: ${{ needs.wasm.outputs.key }}
          fail-on-cache-miss: true

      - name: Typecheck
        run: bun run typecheck
        working-directory: sites

      - name: Build the site
        run: bun run build
        working-directory: sites

      - name: Check the built site
        run: bun scripts/smoke.ts
        working-directory: sites

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: bunx wrangler@4.147.0 deploy
        working-directory: sites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Dry-run deploy
        if: github.event_name == 'pull_request'
        run: bunx wrangler@4.147.0 deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        working-directory: sites
